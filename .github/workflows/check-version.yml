# .github/workflows/check-version.yml
name: Check VERSION and release tags

on:
  pull_request:
  push:
    branches: [ main ]
    tags:
      - '*.*.*'
      - 'v*.*.*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test version policy
        run: python3 -m unittest tests/test_check_version.py

      - name: Determine latest reachable release tag
        id: get_tag
        shell: bash
        run: |
          set -euo pipefail
          latest="$(
            git tag --list --sort=-version:refname --merged HEAD |
              grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"
          echo "Latest reachable release tag: ${latest:-none}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Validate VERSION policy
        shell: bash
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest }}
        run: |
          set -euo pipefail
          args=(--version-file VERSION)

          if [ -n "$LATEST_TAG" ]; then
            args+=(--latest-tag "$LATEST_TAG")
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--release-tag "$GITHUB_REF_NAME")
          fi

          python3 tools/check_version.py "${args[@]}"
